name: Build RISC-V

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/riscv64.yml"
      - "go.mod"
      - "go.sum"
      - "**/*.go"

permissions:
  contents: read

jobs:
  riscv64:
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build and smoke test
        env:
          CGO_ENABLED: "0"
          GOOS: linux
          GOARCH: riscv64
          GOTOOLCHAIN: auto
        run: |
          go version
          uname -m
          go build -mod=readonly -o cloudflared-linux-riscv64 ./cmd/cloudflared
          ./cloudflared-linux-riscv64 --version

      - uses: actions/upload-artifact@v4
        with:
          name: cloudflared-linux-riscv64
          path: cloudflared-linux-riscv64
          if-no-files-found: error
