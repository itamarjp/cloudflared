name: Build RISC-V

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/riscv64.yml"
      - "Dockerfile.riscv64"
      - "go.mod"
      - "go.sum"
      - "**/*.go"
  push:
    branches: [master]
    tags: ["*"]
    paths:
      - ".github/workflows/riscv64.yml"
      - "Dockerfile.riscv64"
      - "go.mod"
      - "go.sum"
      - "**/*.go"

permissions:
  contents: read

jobs:
  riscv64:
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build and smoke test
        env:
          CGO_ENABLED: "0"
          GOOS: linux
          GOARCH: riscv64
          GOTOOLCHAIN: auto
        run: |
          go version
          uname -m
          go build -mod=readonly -o cloudflared-linux-riscv64 ./cmd/cloudflared
          ./cloudflared-linux-riscv64 --version

      - uses: actions/upload-artifact@v4
        with:
          name: cloudflared-linux-riscv64
          path: cloudflared-linux-riscv64
          if-no-files-found: error

      - name: Build and test container
        run: |
          docker build --platform linux/riscv64 -f Dockerfile.riscv64 -t cloudflared:riscv64 .
          docker run --rm --platform linux/riscv64 cloudflared:riscv64

      - name: Log in to GHCR
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish RISC-V image
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/cloudflared
        run: |
          IMAGE=$(echo "$IMAGE" | tr '[:upper:]' '[:lower:]')
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
          else
            TAG="riscv64"
          fi
          docker tag cloudflared:riscv64 "$IMAGE:$TAG"
          docker push "$IMAGE:$TAG"
